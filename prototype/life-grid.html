<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Memento 900</title>
<style>
  :root {
    --bg: #08090a;
    --panel: #0e1012;
    --fg: #e9e9e7;
    --muted: #6b6f72;
    --faint: #16181a;
    --spent: #2c2f33;
    --spent-edge: #3a3e43;
    --now: #f4f4f2;
    --accent: #c9b27d;
    --border: #26292c;
    --m-joy: #d8b24a;
    --m-calm: #5a8fa3;
    --m-love: #b06a86;
    --m-growth: #6f9e6a;
    --m-hard: #8a6a9e;
    --m-grief: #7a7d82;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.5;
  }
  .app { display: flex; min-height: 100vh; }

  /* 顶部语言切换 */
  .lang-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 30;
    display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
    overflow: hidden; background: #101214; font-size: 12px;
  }
  .lang-toggle button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 6px 13px; font: inherit; font-size: 12px; letter-spacing: .04em; transition: color .12s, background .12s;
  }
  .lang-toggle button.active { background: var(--accent); color: #08090a; font-weight: 600; }
  .lang-toggle button:not(.active):hover { color: var(--fg); }
  /* 面板打开时,把切换按钮推到面板左侧,避免被遮 */
  @media (min-width:900px) { body.panel-open .lang-toggle { right: calc(min(420px,92vw) + 16px); } }

  .main {
    flex: 1 1 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 40px) 48px;
    transition: margin-right .22s ease;
    min-width: 0;
  }
  .wrap { width: 100%; max-width: 680px; }

  header { text-align: center; margin-bottom: clamp(18px, 4vw, 32px); }
  .title { font-size: clamp(13px,2.2vw,15px); letter-spacing:.42em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .subtitle { margin-top:10px; font-size:clamp(22px,5vw,30px); font-weight:600; letter-spacing:-.01em; }
  .epigraph { margin-top:12px; font-size:clamp(12px,2.4vw,13.5px); color:var(--muted); font-style:italic; }

  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:center; margin-bottom:clamp(18px,4vw,28px); }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  input[type="date"], input[type="text"], textarea {
    background:#101214; border:1px solid var(--border); color:var(--fg);
    padding:9px 12px; border-radius:8px; font:inherit; font-size:14px; color-scheme:dark;
  }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }

  .stats { display:flex; justify-content:center; gap:clamp(18px,6vw,44px); margin-bottom:clamp(18px,4vw,26px); flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat .num { font-variant-numeric:tabular-nums; font-size:clamp(20px,5vw,26px); font-weight:600; letter-spacing:-.02em; }
  .stat .num.accent { color:var(--accent); }
  .stat .lab { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:4px; }

  .grid { display:grid; grid-template-columns:repeat(30,1fr); gap:clamp(1.5px,.55vw,4px); width:100%; aspect-ratio:1/1; }
  .cell {
    position:relative; aspect-ratio:1/1; border-radius:1.5px;
    background:var(--faint); box-shadow:inset 0 0 0 1px #101214;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease; cursor:pointer;
  }
  .cell.spent { background:var(--spent); box-shadow:inset 0 0 0 1px var(--spent-edge); }
  .cell.now {
    background:var(--now);
    box-shadow:0 0 0 1px var(--now), 0 0 10px 1px rgba(244,244,242,.55);
    animation:pulse 2.6s ease-in-out infinite;
  }
  .cell.filled::after {
    content:""; position:absolute; right:1px; bottom:1px;
    width:3px; height:3px; border-radius:50%; background:var(--accent);
  }
  .cell.now.filled::after { background:#08090a; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.55;} }
  @media (prefers-reduced-motion: reduce) { .cell.now { animation: none; } }
  .cell:hover { transform:scale(1.55); z-index:2; }
  .cell.selected { box-shadow:0 0 0 1.5px var(--accent), 0 0 8px rgba(201,178,125,.5); z-index:3; }

  .legend { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:16px; font-size:11px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:11px; height:11px; border-radius:2px; display:inline-block; }
  .sw-spent { background:var(--spent); box-shadow:inset 0 0 0 1px var(--spent-edge); }
  .sw-now { background:var(--now); }
  .sw-future { background:var(--faint); box-shadow:inset 0 0 0 1px #101214; }
  .sw-filled { background:var(--faint); box-shadow:inset 0 0 0 1px #101214; position:relative; }
  .sw-filled::after { content:""; position:absolute; right:0; bottom:0; width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .note { margin-top:16px; font-size:11.5px; opacity:.7; text-align:center; }

  .panel {
    position:fixed; top:0; right:0; height:100vh; width:min(420px,92vw);
    background:var(--panel); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column; z-index:20; box-shadow:-20px 0 50px rgba(0,0,0,.45);
  }
  .panel.open { transform:translateX(0); }
  .panel-head { padding:20px 22px 14px; border-bottom:1px solid var(--border); }
  .panel-head .pm-month { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .panel-head .pm-title { font-size:20px; font-weight:600; margin-top:4px; }
  .panel-head .pm-sub { font-size:12px; color:var(--muted); margin-top:4px; }
  .panel-close { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; }
  .panel-close:hover { color:var(--fg); }

  .panel-body { flex:1 1 auto; overflow-y:auto; padding:18px 22px; display:flex; flex-direction:column; gap:14px; }

  .moment { border:1px solid var(--border); border-radius:10px; padding:12px; background:#101214; display:flex; flex-direction:column; gap:10px; }
  .moment .mrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .moods { display:flex; gap:6px; }
  .mood-dot { width:20px; height:20px; border-radius:50%; cursor:pointer; opacity:.4; border:2px solid transparent; transition:opacity .1s, transform .1s; }
  .mood-dot:hover { opacity:.8; transform:scale(1.1); }
  .mood-dot.active { opacity:1; border-color:var(--fg); }
  textarea { width:100%; min-height:64px; resize:vertical; }
  .tags-in { width:100%; }
  .photos { display:flex; gap:6px; flex-wrap:wrap; }
  .photos img { width:54px; height:54px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
  .photo-add { width:54px; height:54px; border:1px dashed var(--border); border-radius:6px; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; }
  .photo-add:hover { border-color:var(--accent); color:var(--accent); }
  .moment-del { background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; margin-left:auto; }
  .moment-del:hover { color:#c77; }
  .btn {
    background:#15181b; border:1px solid var(--border); color:var(--fg);
    padding:10px 14px; border-radius:9px; font:inherit; font-size:13px; cursor:pointer; width:100%;
  }
  .btn:hover { border-color:var(--accent); }
  .btn.ghost { background:none; }
  .empty-hint { color:var(--muted); font-size:13px; text-align:center; padding:18px 0; }

  .panel-foot { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; }
  .panel-foot .btn { width:auto; flex:1; }

  @media (min-width:900px) { body.panel-open .main { margin-right:min(420px,92vw); } }
</style>
</head>
<body>
<div class="lang-toggle" id="langToggle">
  <button data-lang="zh">中</button>
  <button data-lang="en">EN</button>
</div>

<div class="app">
  <div class="main">
    <div class="wrap">
      <header>
        <div class="title">Memento&nbsp;900</div>
        <div class="subtitle" id="subtitle"></div>
        <div class="epigraph" id="epigraph"></div>
      </header>

      <div class="controls">
        <div class="field">
          <label for="dob" id="dobLabel"></label>
          <input type="date" id="dob" />
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="num" id="s-lived">—</div><div class="lab" id="lab-lived"></div></div>
        <div class="stat"><div class="num accent" id="s-left">—</div><div class="lab" id="lab-left"></div></div>
        <div class="stat"><div class="num" id="s-pct">—</div><div class="lab" id="lab-pct"></div></div>
        <div class="stat"><div class="num" id="s-rec">—</div><div class="lab" id="lab-rec"></div></div>
      </div>

      <div class="grid" id="grid" role="img" aria-label="900 months"></div>

      <div class="legend" id="legend"></div>
      <div class="note" id="note"></div>
    </div>
  </div>

  <aside class="panel" id="panel">
    <button class="panel-close" id="closeBtn" aria-label="close">×</button>
    <div class="panel-head">
      <div class="pm-month" id="pmMonth"></div>
      <div class="pm-title" id="pmTitle">—</div>
      <div class="pm-sub" id="pmSub"></div>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot">
      <button class="btn ghost" id="addMoment"></button>
    </div>
  </aside>
</div>

<script>
  /* ============ i18n ============ */
  const I18N = {
    zh: {
      htmlLang: 'zh',
      subtitle: '你的一生 · 900 个月',
      epigraph: '每一格,是一个再也回不来的月份。',
      dobLabel: '出生日期',
      lived: '已度过', left: '剩余', pct: '已流逝', rec: '已记录',
      lgSpent: '已度过', lgNow: '当下', lgFuture: '未到来', lgFilled: '有记录',
      note: '点击任意格子记录这个月 · 数据存在本机 · 刷新不丢',
      addMoment: '+ 添加一个时刻',
      del: '删除',
      emptyHint: '这个月还没有记录。点下方「+ 添加一个时刻」开始。',
      phText: '这一刻发生了什么?它对你意味着什么?',
      phTags: '标签,用逗号分隔(如:旅行, 家人)',
      photoRemove: '点击移除',
      moods: { joy:'喜悦', calm:'平静', love:'爱', growth:'成长', hard:'艰难', grief:'失去' },
      monthOf: (i) => `第 ${i+1} 个月 / 900`,
      // 真实日历:2003 年 9 月
      calLabel: (y,m) => `${y} 年 ${m} 月`,
      ageLabel: (ay,am) => `约 ${ay} 岁 ${am} 个月`,
      cellTitle: (i, ay, am, tag) => `第 ${i+1} 个月 · 约 ${ay} 岁 ${am} 个月 · ${tag}`,
      tagSpent: '已度过', tagNow: '← 你在这里', tagFuture: '尚未到来',
    },
    en: {
      htmlLang: 'en',
      subtitle: 'Your Life · 900 Months',
      epigraph: 'Each square is a month you will never get back.',
      dobLabel: 'Date of Birth',
      lived: 'Lived', left: 'Remaining', pct: 'Elapsed', rec: 'Recorded',
      lgSpent: 'Lived', lgNow: 'Now', lgFuture: 'Future', lgFilled: 'Recorded',
      note: 'Click any square to record that month · Stored on this device · Survives refresh',
      addMoment: '+ Add a moment',
      del: 'Delete',
      emptyHint: 'Nothing recorded for this month yet. Tap “+ Add a moment” below to start.',
      phText: 'What happened in this moment? What did it mean to you?',
      phTags: 'Tags, comma-separated (e.g. travel, family)',
      photoRemove: 'Click to remove',
      moods: { joy:'Joy', calm:'Calm', love:'Love', growth:'Growth', hard:'Hard', grief:'Grief' },
      monthOf: (i) => `Month ${i+1} / 900`,
      calLabel: (y,m) => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`,
      ageLabel: (ay,am) => `~${ay}y ${am}m old`,
      cellTitle: (i, ay, am, tag) => `Month ${i+1} · ~${ay}y ${am}m · ${tag}`,
      tagSpent: 'Lived', tagNow: '← you are here', tagFuture: 'not yet',
    },
  };
  const LANG_KEY = 'memento900.lang';
  let lang = localStorage.getItem(LANG_KEY) || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
  const t = () => I18N[lang];

  /* ============ 核心逻辑(移植自 time.ts) ============ */
  const GRID = 30, TOTAL = GRID * GRID;
  const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
  function monthsBetween(birth, asOf){
    if (asOf <= birth) return 0;
    let months = (asOf.getFullYear()-birth.getFullYear())*12 + (asOf.getMonth()-birth.getMonth());
    const threshold = Math.min(birth.getDate(), daysInMonth(asOf.getFullYear(), asOf.getMonth()));
    if (asOf.getDate() < threshold) months -= 1;
    return Math.max(0, months);
  }
  function lifeState(birth, asOf){
    const lived = Math.min(monthsBetween(birth, asOf), TOTAL);
    return { lived, remaining: TOTAL-lived, isComplete: lived>=TOTAL, currentIndex: lived>=TOTAL?TOTAL-1:lived, pct:(lived/TOTAL)*100 };
  }

  /* ============ 数据 ============ */
  const MOODS = [
    {key:'joy', c:'var(--m-joy)'}, {key:'calm', c:'var(--m-calm)'}, {key:'love', c:'var(--m-love)'},
    {key:'growth', c:'var(--m-growth)'}, {key:'hard', c:'var(--m-hard)'}, {key:'grief', c:'var(--m-grief)'},
  ];
  const STORE_KEY = 'memento900.entries.v1';
  let entries = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(entries));
  const hasRecord = i => entries[i] && entries[i].moments && entries[i].moments.length > 0;
  const uid = () => Math.random().toString(36).slice(2,9);

  /* ============ 网格 ============ */
  const gridEl = document.getElementById('grid');
  const cells = [];
  for (let i=0;i<TOTAL;i++){
    const c = document.createElement('div');
    c.className = 'cell';
    c.addEventListener('click', () => openPanel(i));
    gridEl.appendChild(c); cells.push(c);
  }

  let currentBirth = null;
  let selectedIndex = -1;

  function renderGrid(){
    const st = lifeState(currentBirth, new Date());
    let recCount = 0;
    for (let i=0;i<TOTAL;i++){
      const c = cells[i];
      let cls = 'cell';
      if (i < st.lived) cls += ' spent';
      else if (i === st.currentIndex && !st.isComplete) cls += ' now';
      if (hasRecord(i)) { cls += ' filled'; recCount++; }
      if (i === selectedIndex) cls += ' selected';
      c.className = cls;
      const ay = Math.floor(i/12), am = i%12;
      const tag = i<st.lived ? t().tagSpent : (i===st.currentIndex&&!st.isComplete ? t().tagNow : t().tagFuture);
      c.title = t().cellTitle(i, ay, am, tag);
    }
    document.getElementById('s-lived').textContent = st.lived;
    document.getElementById('s-left').textContent = st.remaining;
    document.getElementById('s-pct').textContent = st.pct.toFixed(1)+'%';
    document.getElementById('s-rec').textContent = recCount;
  }

  function monthLabel(i){
    const d = new Date(currentBirth.getFullYear(), currentBirth.getMonth()+i, 1);
    const y = d.getFullYear(), m = d.getMonth()+1;
    const ay = Math.floor(i/12), am = i%12;
    return { cal: t().calLabel(y,m), age: t().ageLabel(ay,am) };
  }

  /* ============ 面板 ============ */
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panelBody');

  function openPanel(i){
    selectedIndex = i;
    const lab = monthLabel(i);
    document.getElementById('pmMonth').textContent = t().monthOf(i);
    document.getElementById('pmTitle').textContent = lab.cal;
    document.getElementById('pmSub').textContent = lab.age;
    if (!entries[i]) entries[i] = { moments: [] };
    renderMoments(i);
    panel.classList.add('open');
    document.body.classList.add('panel-open');
    renderGrid();
  }
  function closePanel(){
    panel.classList.remove('open');
    document.body.classList.remove('panel-open');
    selectedIndex = -1; renderGrid();
  }
  document.getElementById('closeBtn').addEventListener('click', closePanel);

  function renderMoments(i){
    const moments = entries[i].moments;
    panelBody.innerHTML = '';
    if (moments.length === 0){
      const e = document.createElement('div');
      e.className = 'empty-hint';
      e.textContent = t().emptyHint;
      panelBody.appendChild(e);
      return;
    }
    moments.forEach(mo => panelBody.appendChild(momentEl(i, mo)));
  }

  function momentEl(i, mo){
    const wrap = document.createElement('div'); wrap.className = 'moment';

    const row = document.createElement('div'); row.className='mrow';
    const moods = document.createElement('div'); moods.className='moods';
    MOODS.forEach(m => {
      const dot = document.createElement('div');
      dot.className = 'mood-dot' + (mo.mood===m.key?' active':'');
      dot.style.background = m.c; dot.title = t().moods[m.key];
      dot.addEventListener('click', () => { mo.mood = (mo.mood===m.key?null:m.key); save(); renderMoments(i); renderGrid(); });
      moods.appendChild(dot);
    });
    row.appendChild(moods);
    const del = document.createElement('button'); del.className='moment-del'; del.textContent=t().del;
    del.addEventListener('click', () => {
      entries[i].moments = entries[i].moments.filter(x => x.id !== mo.id);
      save(); renderMoments(i); renderGrid();
    });
    row.appendChild(del);
    wrap.appendChild(row);

    const ta = document.createElement('textarea');
    ta.placeholder = t().phText; ta.value = mo.text || '';
    ta.addEventListener('input', () => { mo.text = ta.value; save(); });
    wrap.appendChild(ta);

    const tags = document.createElement('input');
    tags.type='text'; tags.className='tags-in'; tags.placeholder = t().phTags;
    tags.value = (mo.tags||[]).join(', ');
    tags.addEventListener('input', () => { mo.tags = tags.value.split(',').map(s=>s.trim()).filter(Boolean); save(); });
    wrap.appendChild(tags);

    const photos = document.createElement('div'); photos.className='photos';
    (mo.photos||[]).forEach((src, idx) => {
      const img = document.createElement('img'); img.src = src; img.title=t().photoRemove;
      img.addEventListener('click', () => { mo.photos.splice(idx,1); save(); renderMoments(i); renderGrid(); });
      photos.appendChild(img);
    });
    const add = document.createElement('label'); add.className='photo-add'; add.textContent='+';
    const file = document.createElement('input'); file.type='file'; file.accept='image/*'; file.style.display='none';
    file.addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { mo.photos = mo.photos || []; mo.photos.push(reader.result); save(); renderMoments(i); renderGrid(); };
      reader.readAsDataURL(f);
    });
    add.appendChild(file); photos.appendChild(add);
    wrap.appendChild(photos);
    return wrap;
  }

  document.getElementById('addMoment').addEventListener('click', () => {
    if (selectedIndex < 0) return;
    entries[selectedIndex].moments.push({ id:uid(), text:'', mood:null, tags:[], photos:[] });
    save(); renderMoments(selectedIndex); renderGrid();
  });

  /* ============ 静态文案应用 + 语言切换 ============ */
  function applyStaticText(){
    const L = t();
    document.documentElement.lang = L.htmlLang;
    document.getElementById('subtitle').textContent = L.subtitle;
    document.getElementById('epigraph').textContent = L.epigraph;
    document.getElementById('dobLabel').textContent = L.dobLabel;
    document.getElementById('lab-lived').textContent = L.lived;
    document.getElementById('lab-left').textContent = L.left;
    document.getElementById('lab-pct').textContent = L.pct;
    document.getElementById('lab-rec').textContent = L.rec;
    document.getElementById('note').textContent = L.note;
    document.getElementById('addMoment').textContent = L.addMoment;
    document.getElementById('legend').innerHTML =
      `<span><i class="swatch sw-spent"></i>${L.lgSpent}</span>` +
      `<span><i class="swatch sw-now"></i>${L.lgNow}</span>` +
      `<span><i class="swatch sw-future"></i>${L.lgFuture}</span>` +
      `<span><i class="swatch sw-filled"></i>${L.lgFilled}</span>`;
    // 切换按钮高亮
    document.querySelectorAll('#langToggle button').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === lang));
  }

  function setLang(next){
    lang = next;
    localStorage.setItem(LANG_KEY, lang);
    applyStaticText();
    renderGrid();
    // 若面板开着,重渲染面板里的动态文案
    if (selectedIndex >= 0) openPanel(selectedIndex);
  }
  document.querySelectorAll('#langToggle button').forEach(b =>
    b.addEventListener('click', () => setLang(b.dataset.lang)));

  /* ============ 出生日期 ============ */
  const dob = document.getElementById('dob');
  dob.value = '1995-06-15';
  dob.max = new Date().toISOString().slice(0,10);
  function update(){
    if (!dob.value) return;
    currentBirth = new Date(dob.value + 'T12:00:00');
    renderGrid();
  }
  dob.addEventListener('change', update);

  /* ============ 启动 ============ */
  applyStaticText();
  update();
</script>
</body>
</html>
